name: Extract project

on:
  workflow_dispatch:
  push:
    paths:
      - "smash_zone_final.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o smash_zone_final.zip -d extracted
          cp -R extracted/. .
          rm -rf extracted
          rm -f smash_zone_final.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract Smash Zone project"
          git push
